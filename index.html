<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders — Grist Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05050f;
    --accent: #00ff88;
    --accent2: #ff2d6b;
    --accent3: #00cfff;
    --text: #e0ffe0;
    --muted: #4a6a5a;
    --font-main: 'Press Start 2P', monospace;
    --font-mono: 'Share Tech Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 40%, #aaf 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 5%,  #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 60%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 20%, #aaf 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 80%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 75%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 90%, #aaf 0%, transparent 100%),
      radial-gradient(1px 1px at 5%  55%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 35%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 10%, #aaf 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 95%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 90%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 45%, #aaf 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 70%, #fff 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 6px 0;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 700px;
    padding: 4px 0;
    font-size: 8px;
    letter-spacing: 1px;
  }
  #hud .hud-item { display: flex; flex-direction: column; gap: 3px; }
  #hud .hud-label { color: var(--muted); font-size: 6px; letter-spacing: 2px; }
  #hud .hud-val { color: var(--accent); font-size: 10px; }
  #lives-display { color: var(--accent2); font-size: 10px; letter-spacing: 4px; }

  canvas {
    display: block;
    border: 1px solid #1a1a3a;
    box-shadow: 0 0 40px rgba(0,255,136,0.08);
    image-rendering: pixelated;
  }

  #name-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    font-size: 7px;
    color: var(--muted);
    letter-spacing: 1px;
    width: 700px;
    justify-content: center;
  }
  #name-bar input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-main);
    font-size: 8px;
    padding: 3px 6px;
    width: 140px;
    outline: none;
    letter-spacing: 2px;
  }
  #name-bar input::placeholder { color: var(--muted); font-size: 7px; }

  #grist-status {
    font-size: 6px;
    color: var(--muted);
    letter-spacing: 1px;
    padding: 2px 6px;
    border: 1px solid #1a3a2a;
    border-radius: 2px;
    transition: color 0.3s, border-color 0.3s;
  }
  #grist-status.ok     { color: #2aff8a;       border-color: #0d4a2a; }
  #grist-status.err    { color: var(--accent2); border-color: #4a1a1a; }
  #grist-status.saving { color: #ffd700;        border-color: #4a3a00; }

  #ctrl-bar {
    display: flex;
    gap: 20px;
    margin-top: 5px;
    font-size: 6px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .key {
    border: 1px solid #2a3a2a;
    padding: 2px 5px;
    color: var(--text);
    font-size: 6px;
    border-radius: 2px;
  }

  #leaderboard {
    width: 700px;
    margin-top: 6px;
    background: rgba(0,255,136,0.03);
    border: 1px solid #0d2a1a;
    padding: 6px 12px;
  }
  #leaderboard h3 {
    font-size: 6px;
    color: var(--muted);
    letter-spacing: 3px;
    margin-bottom: 5px;
    border-bottom: 1px solid #0d2a1a;
    padding-bottom: 4px;
  }
  #lb-rows { display: flex; flex-direction: column; gap: 2px; min-height: 16px; }
  .lb-row {
    display: flex;
    justify-content: space-between;
    font-size: 7px;
    padding: 2px 0;
    font-family: var(--font-mono);
  }
  .lb-row .lb-rank  { color: var(--muted);  width: 24px; }
  .lb-row .lb-name  { color: var(--text);   flex: 1; letter-spacing: 1px; }
  .lb-row .lb-lvl   { color: var(--muted);  width: 60px; text-align: center; font-size: 6px; }
  .lb-row .lb-score { color: var(--accent); width: 70px; text-align: right; }
  .lb-row.gold   .lb-name, .lb-row.gold   .lb-score { color: #ffd700; }
  .lb-row.silver .lb-name, .lb-row.silver .lb-score { color: #c0c0c0; }
  .lb-row.bronze .lb-name, .lb-row.bronze .lb-score { color: #cd7f32; }
  #lb-status { font-size: 6px; color: var(--muted); text-align: center; margin-top: 3px; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-item">
      <div class="hud-label">SCORE</div>
      <div class="hud-val" id="sc">000000</div>
    </div>
    <div class="hud-item" style="align-items:center">
      <div class="hud-label">VIES</div>
      <div id="lives-display">&#9829; &#9829; &#9829;</div>
    </div>
    <div class="hud-item" style="align-items:flex-end">
      <div class="hud-label">NIVEAU</div>
      <div class="hud-val" id="lvl-display">01</div>
    </div>
  </div>

  <canvas id="c" width="700" height="500"></canvas>

  <div id="name-bar">
    <span>JOUEUR&nbsp;:</span>
    <input id="player-name" type="text" maxlength="12" placeholder="TON NOM" spellcheck="false" autocomplete="off" />
    <span id="grist-status">&#9711; GRIST</span>
  </div>

  <div id="ctrl-bar">
    <span><span class="key">&#8592;</span>&nbsp;<span class="key">&#8594;</span>&nbsp;d&eacute;placer</span>
    <span><span class="key">ESPACE</span>&nbsp;tirer</span>
    <span><span class="key">P</span>&nbsp;pause</span>
  </div>

  <div id="leaderboard">
    <h3>&#11041; HALL OF FAME</h3>
    <div id="lb-rows"><div class="lb-row" style="justify-content:center;color:var(--muted);font-size:6px">CHARGEMENT...</div></div>
    <div id="lb-status"></div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const TABLE_NAME = 'Scores'; // Nom de la table Grist (colonnes : Joueur, Score, Niveau, Date)
const W = 700, H = 500;

const C = {
  bg: '#05050f', player: '#00ff88', bullet: '#00ff88',
  eBullet: '#ff2d6b', invA: '#ff2d6b', invB: '#00cfff', invC: '#b060ff',
  ufo: '#ffd700',
};

// ─── GRIST ────────────────────────────────────────────────────────────────────
let gristReady = false;
const statusEl = document.getElementById('grist-status');

function setStatus(cls, msg) {
  statusEl.className = cls;
  statusEl.textContent = '\u25cb ' + msg;
}

// Charge l'API Grist dynamiquement
(function loadGristApi() {
  const s = document.createElement('script');
  s.src = 'https://docs.getgrist.com/grist-plugin-api.js';
  s.onload = function() {
    if (typeof grist === 'undefined') { setStatus('err', 'API INDISPONIBLE'); loadDemoLeaderboard(); return; }
    try {
      grist.ready({ requiredAccess: 'full' });
      if (typeof grist.onReady === 'function') {
        grist.onReady(function() { gristReady = true; setStatus('ok', 'CONNECTE'); loadLeaderboard(); });
      } else {
        setTimeout(function() { gristReady = true; setStatus('ok', 'CONNECTE'); loadLeaderboard(); }, 900);
      }
    } catch(e) { setStatus('err', 'ERREUR INIT'); loadDemoLeaderboard(); }
  };
  s.onerror = function() { setStatus('err', 'HORS GRIST'); loadDemoLeaderboard(); };
  document.head.appendChild(s);
})();

// Sauvegarde NON-BLOQUANTE : ne plante pas le jeu en cas d'erreur
function saveScore(name, score, level) {
  if (!gristReady) { setStatus('err', 'NON CONNECTE'); return; }
  setStatus('saving', 'SAUVEGARDE...');
  var date = new Date().toISOString().slice(0, 10);
  var actions = [['AddRecord', TABLE_NAME, null, { Joueur: name || 'ANONYME', Score: score, Niveau: level, Date: date }]];
  var p;
  try { p = grist.docApi.applyUserActions(actions); } catch(e) { onSaveError(e); return; }
  if (p && typeof p.then === 'function') {
    p.then(function() {
      setStatus('ok', 'SCORE SAUVE !');
      setTimeout(function() { setStatus('ok', 'CONNECTE'); }, 2500);
      loadLeaderboard();
    }).catch(function(e) { onSaveError(e); });
  } else {
    // sync result (shouldn't happen but handle it)
    setStatus('ok', 'SCORE SAUVE !');
    setTimeout(function() { setStatus('ok', 'CONNECTE'); }, 2500);
    loadLeaderboard();
  }
}

function onSaveError(e) {
  console.error('saveScore error:', e);
  var hint = (e && e.message) ? e.message.slice(0, 24) : 'ERREUR';
  setStatus('err', hint);
  // Affiche un rappel sur la table manquante
  document.getElementById('lb-status').textContent = 'VERIFIEZ QUE LA TABLE "' + TABLE_NAME + '" EXISTE DANS GRIST';
}

function loadLeaderboard() {
  if (!gristReady) return;
  var p;
  try { p = grist.docApi.fetchTable(TABLE_NAME); } catch(e) { onLoadError(e); return; }
  if (p && typeof p.then === 'function') {
    p.then(function(table) {
      var len = (table.Joueur || []).length;
      var rows = [];
      for (var i = 0; i < len; i++) {
        rows.push({ name: String(table.Joueur[i] || '???'), score: Number(table.Score[i]) || 0, level: Number(table.Niveau[i]) || 1 });
      }
      rows.sort(function(a, b) { return b.score - a.score; });
      renderLeaderboard(rows.slice(0, 8));
    }).catch(function(e) { onLoadError(e); });
  }
}

function onLoadError(e) {
  document.getElementById('lb-status').textContent = 'TABLE "' + TABLE_NAME + '" INTROUVABLE - CREEZ-LA DANS GRIST';
}

function loadDemoLeaderboard() {
  renderLeaderboard([
    { name: 'RAZOR', score: 12400, level: 5 },
    { name: 'NOVA',  score:  9800, level: 4 },
    { name: 'GHOST', score:  7200, level: 3 },
    { name: 'PIXEL', score:  5100, level: 2 },
    { name: 'ACE',   score:  3200, level: 2 },
  ]);
  document.getElementById('lb-status').textContent = '- MODE DEMONSTRATION -';
}

function renderLeaderboard(rows) {
  var container = document.getElementById('lb-rows');
  var medals = ['gold', 'silver', 'bronze'];
  if (!rows.length) {
    container.innerHTML = '<div class="lb-row" style="justify-content:center;color:var(--muted);font-size:6px">PAS ENCORE DE SCORES</div>';
    return;
  }
  container.innerHTML = rows.map(function(r, i) {
    return '<div class="lb-row ' + (medals[i] || '') + '">'
      + '<span class="lb-rank">' + String(i + 1).padStart(2, '0') + '.</span>'
      + '<span class="lb-name">' + r.name.toUpperCase().slice(0, 12) + '</span>'
      + '<span class="lb-lvl">NV.' + String(r.level).padStart(2, '0') + '</span>'
      + '<span class="lb-score">' + String(r.score).padStart(6, '0') + '</span>'
      + '</div>';
  }).join('');
}

// ─── GAME ────────────────────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var gameState = 'idle';
var score = 0, lives = 3, level = 1;
var keys = {};
var lastTime = 0;

var player = { x: W / 2 - 18, y: H - 55, w: 36, h: 22, speed: 240 };
var bullets = [], eBullets = [], particles = [], shields = [], invaders = [];
var bulletCD = 0, eFireTimer = 0, invMoveT = 0, invMoveI = 0.8;
var invDir = 1, invStepX = 12;
var ufo = null, ufoTimer = 0, ufoInterval = 18;
var levelUpTimer = 0;

function buildInvaders(lvl) {
  invaders = [];
  var cols = 11, rows = 4, gapX = 52, gapY = 42;
  var startX = (W - cols * gapX) / 2;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      invaders.push({ x: startX + c * gapX, y: 55 + r * gapY, w: 28, h: 20, type: r === 0 ? 2 : r < 2 ? 1 : 0, alive: true, frame: 0 });
    }
  }
  invMoveI = Math.max(0.10, 0.8 - (lvl - 1) * 0.1);
  eFireTimer = 0; invMoveT = 0;
}

function buildShields() {
  shields = [];
  var positions = [80, 210, 340, 470, 590];
  for (var pi = 0; pi < positions.length; pi++) {
    var px = positions[pi];
    for (var r = 0; r < 3; r++) {
      for (var c = 0; c < 5; c++) {
        shields.push({ x: px + c * 10, y: H - 110 + r * 10, w: 10, h: 10, hp: 3 });
      }
    }
  }
}

function initGame() {
  score = 0; lives = 3; level = 1;
  player.x = W / 2 - 18;
  bullets = []; eBullets = []; particles = [];
  bulletCD = 0; ufo = null; ufoTimer = 0;
  buildInvaders(1); buildShields(); updateHUD();
}

function updateHUD() {
  document.getElementById('sc').textContent = String(score).padStart(6, '0');
  document.getElementById('lvl-display').textContent = String(level).padStart(2, '0');
  var icons = '';
  for (var i = 0; i < 3; i++) icons += (i < lives ? '\u2665' : '\u2661') + (i < 2 ? ' ' : '');
  document.getElementById('lives-display').textContent = icons;
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function drawPlayer() {
  var x = player.x, y = player.y, w = player.w, h = player.h;
  ctx.shadowBlur = 14; ctx.shadowColor = 'rgba(0,255,136,0.5)';
  ctx.fillStyle = C.player;
  ctx.fillRect(x + 5, y + 7, w - 10, h - 7);
  ctx.fillRect(x + 12, y + 2, 12, 9);
  ctx.fillRect(x + 15, y, 6, 5);
  ctx.fillRect(x, y + 15, 7, 7);
  ctx.fillRect(x + w - 7, y + 15, 7, 7);
  ctx.shadowBlur = 0;
}

function drawInvader(inv) {
  var x = inv.x, y = inv.y, w = inv.w, t = inv.type, f = inv.frame;
  var col = [C.invC, C.invB, C.invA][t];
  ctx.fillStyle = col; ctx.shadowBlur = 6; ctx.shadowColor = col;
  if (t === 0) {
    ctx.fillRect(x+4,y,w-8,4); ctx.fillRect(x+2,y+4,w-4,4); ctx.fillRect(x,y+8,w,4);
    ctx.fillRect(x+2,y+12,4,4); ctx.fillRect(x+w-6,y+12,4,4);
    if (f) { ctx.fillRect(x,y+12,2,4); ctx.fillRect(x+w-2,y+12,2,4); }
    else   { ctx.fillRect(x+2,y+14,2,4); ctx.fillRect(x+w-4,y+14,2,4); }
  } else if (t === 1) {
    ctx.fillRect(x+4,y,4,4); ctx.fillRect(x+w-8,y,4,4);
    ctx.fillRect(x+2,y+4,w-4,4); ctx.fillRect(x,y+8,w,4);
    ctx.fillRect(x+4,y+12,4,4); ctx.fillRect(x+w-8,y+12,4,4);
    if (f) { ctx.fillRect(x,y+4,2,4); ctx.fillRect(x+w-2,y+4,2,4); }
  } else {
    ctx.fillRect(x+2,y,w-4,4); ctx.fillRect(x,y+4,w,8);
    ctx.fillRect(x+2,y+12,4,4); ctx.fillRect(x+w-6,y+12,4,4);
    ctx.fillRect(x+8,y+12,4,4); ctx.fillRect(x+w-12,y+12,4,4);
    ctx.fillStyle = C.bg;
    ctx.fillRect(x+6,y+6,3,3); ctx.fillRect(x+w-9,y+6,3,3);
  }
  ctx.shadowBlur = 0;
}

function drawUFO() {
  if (!ufo) return;
  ctx.fillStyle = C.ufo; ctx.shadowBlur = 10; ctx.shadowColor = C.ufo;
  ctx.fillRect(ufo.x+10,ufo.y,ufo.w-20,ufo.h-4);
  ctx.fillRect(ufo.x+4,ufo.y+4,ufo.w-8,ufo.h-4);
  ctx.fillRect(ufo.x,ufo.y+8,ufo.w,ufo.h-8);
  ctx.fillStyle = C.bg;
  for (var i = 0; i < 3; i++) ctx.fillRect(ufo.x+8+i*12,ufo.y+9,6,4);
  ctx.shadowBlur = 0;
}

function drawShields() {
  for (var i = 0; i < shields.length; i++) {
    var s = shields[i];
    if (s.hp <= 0) continue;
    ctx.fillStyle = 'rgba(0,255,136,' + (s.hp / 3 * 0.85) + ')';
    ctx.fillRect(s.x, s.y, s.w, s.h);
  }
}

function drawBullets() {
  ctx.shadowBlur = 8;
  for (var i = 0; i < bullets.length;  i++) { ctx.shadowColor = C.bullet;  ctx.fillStyle = C.bullet;  ctx.fillRect(bullets[i].x-1,  bullets[i].y,  3, 12); }
  for (var j = 0; j < eBullets.length; j++) { ctx.shadowColor = C.eBullet; ctx.fillStyle = C.eBullet; ctx.fillRect(eBullets[j].x-1, eBullets[j].y, 3,  9); }
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  ctx.strokeStyle = 'rgba(0,255,136,0.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H-35); ctx.lineTo(W, H-35); ctx.stroke();
}

function drawOverlay(line1, line2) {
  ctx.fillStyle = 'rgba(5,5,15,0.78)'; ctx.fillRect(0,0,W,H);
  ctx.shadowBlur = 20; ctx.shadowColor = '#00ff88';
  ctx.fillStyle = '#00ff88'; ctx.font = '18px "Press Start 2P"'; ctx.textAlign = 'center';
  ctx.fillText(line1, W/2, H/2-24);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#4a8a6a'; ctx.font = '8px "Press Start 2P"';
  ctx.fillText(line2, W/2, H/2+12);
  ctx.textAlign = 'left';
}

function drawLevelUp() {
  var alpha = Math.min(1, levelUpTimer * 2.5);
  ctx.globalAlpha = alpha;
  ctx.shadowBlur = 16; ctx.shadowColor = '#00cfff';
  ctx.fillStyle = '#00cfff'; ctx.font = '14px "Press Start 2P"'; ctx.textAlign = 'center';
  ctx.fillText('NIVEAU ' + level + ' !', W/2, H/2);
  ctx.textAlign = 'left'; ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
function explode(x, y, color, n) {
  n = n || 12;
  for (var i = 0; i < n; i++) {
    var a = Math.random()*Math.PI*2, spd = 30+Math.random()*90;
    particles.push({ x:x, y:y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, color:color, life:0.5+Math.random()*0.5, maxLife:0.5+Math.random()*0.5, s:2+Math.random()*3 });
  }
}

function collide(b, obj) {
  return b.x > obj.x && b.x < obj.x+obj.w && b.y > obj.y && b.y < obj.y+obj.h;
}

function tickParticles(dt) {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 60*dt; p.life -= dt;
  }
  particles = particles.filter(function(p) { return p.life > 0; });
}

function update(dt) {
  if (gameState === 'levelup') { levelUpTimer -= dt; if (levelUpTimer <= 0) gameState = 'playing'; tickParticles(dt); return; }
  if (gameState !== 'playing') return;

  // Player move
  if (keys['ArrowLeft']  || keys['a']) player.x = Math.max(0, player.x - player.speed*dt);
  if (keys['ArrowRight'] || keys['d']) player.x = Math.min(W-player.w, player.x + player.speed*dt);

  // Player shoot
  bulletCD -= dt;
  if ((keys[' '] || keys['ArrowUp']) && bulletCD <= 0) {
    bullets.push({ x: player.x+player.w/2, y: player.y, speed: 520 });
    bulletCD = 0.28;
  }

  // Move bullets
  var i;
  for (i = bullets.length-1; i >= 0; i--)  { bullets[i].y  -= bullets[i].speed*dt;  if (bullets[i].y < -12)  bullets.splice(i,1); }
  for (i = eBullets.length-1; i >= 0; i--) { eBullets[i].y += eBullets[i].speed*dt; if (eBullets[i].y > H+12) eBullets.splice(i,1); }

  // Move invaders
  invMoveT += dt;
  if (invMoveT >= invMoveI) {
    invMoveT = 0;
    var alive = invaders.filter(function(iv) { return iv.alive; });
    var edge = false;
    for (i = 0; i < alive.length; i++) { alive[i].frame = 1-alive[i].frame; alive[i].x += invStepX*invDir; if (alive[i].x <= 2 || alive[i].x+alive[i].w >= W-2) edge = true; }
    if (edge) { invDir *= -1; for (i = 0; i < alive.length; i++) alive[i].y += 20; invMoveI = Math.max(0.06, invMoveI*0.93); }
  }

  // Enemy fire
  eFireTimer += dt;
  var eInterval = Math.max(0.35, 1.5-(level-1)*0.18);
  if (eFireTimer >= eInterval) {
    eFireTimer = 0;
    var alive2 = invaders.filter(function(iv) { return iv.alive; });
    if (alive2.length) {
      var sh = alive2[Math.floor(Math.random()*alive2.length)];
      eBullets.push({ x: sh.x+sh.w/2, y: sh.y+sh.h, speed: 150+level*22 });
    }
  }

  // UFO
  ufoTimer += dt;
  if (!ufo && ufoTimer >= ufoInterval) {
    ufoTimer = 0; ufoInterval = 14+Math.random()*10;
    var dir = Math.random() < 0.5 ? 1 : -1;
    ufo = { x: dir > 0 ? -55 : W+55, y: 18, w: 48, h: 18, dir: dir, speed: 130 };
  }
  if (ufo) { ufo.x += ufo.dir*ufo.speed*dt; if (ufo.x > W+70 || ufo.x < -70) ufo = null; }

  // Player bullets vs invaders
  outer: for (i = bullets.length-1; i >= 0; i--) {
    for (var j = 0; j < invaders.length; j++) {
      if (!invaders[j].alive || !collide(bullets[i], invaders[j])) continue;
      invaders[j].alive = false;
      explode(invaders[j].x+invaders[j].w/2, invaders[j].y+invaders[j].h/2, [C.invC,C.invB,C.invA][invaders[j].type], 10);
      score += (invaders[j].type===2?30:invaders[j].type===1?20:10)*level;
      bullets.splice(i,1); updateHUD();
      continue outer;
    }
  }

  // Player bullets vs UFO
  for (i = bullets.length-1; i >= 0; i--) {
    if (ufo && collide(bullets[i], ufo)) {
      explode(ufo.x+ufo.w/2, ufo.y+ufo.h/2, C.ufo, 18);
      score += 150*level; ufo = null; bullets.splice(i,1); updateHUD();
    }
  }

  // Bullets vs shields
  var bArrs = [bullets, eBullets];
  for (var ai = 0; ai < bArrs.length; ai++) {
    var arr = bArrs[ai];
    for (i = arr.length-1; i >= 0; i--) {
      for (j = 0; j < shields.length; j++) {
        if (shields[j].hp > 0 && collide(arr[i], shields[j])) { shields[j].hp--; arr.splice(i,1); break; }
      }
    }
  }

  // Enemy bullets vs player
  for (i = eBullets.length-1; i >= 0; i--) {
    if (collide(eBullets[i], player)) {
      eBullets.splice(i,1); lives--; updateHUD();
      explode(player.x+player.w/2, player.y+player.h/2, C.player, 22);
      if (lives <= 0) { endGame(); return; }
    }
  }

  // Invaders reach ground
  for (i = 0; i < invaders.length; i++) {
    if (invaders[i].alive && invaders[i].y+invaders[i].h >= H-35) { endGame(); return; }
  }

  // All dead → level up
  var allDead = true;
  for (i = 0; i < invaders.length; i++) { if (invaders[i].alive) { allDead = false; break; } }
  if (allDead) {
    level++; bullets = []; eBullets = [];
    buildInvaders(level); buildShields(); updateHUD();
    levelUpTimer = 2.0; gameState = 'levelup';
  }

  tickParticles(dt);
}

function endGame() {
  gameState = 'dead';
  updateHUD();
  var name = document.getElementById('player-name').value.trim() || 'ANONYME';
  // Non-blocking save — game stays responsive even if Grist fails
  try { saveScore(name, score, level); } catch(e) { onSaveError(e); }
}

// ─── RENDER LOOP ─────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(0,30,10,0.35)'; ctx.lineWidth = 1;
  for (var y = 0; y < H; y += 18) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  drawGround(); drawShields(); drawBullets();
  for (var i = 0; i < invaders.length; i++) { if (invaders[i].alive) drawInvader(invaders[i]); }
  drawUFO(); drawPlayer(); drawParticles();

  if (gameState === 'idle')    drawOverlay('SPACE INVADERS', 'APPUIE SUR ESPACE POUR JOUER');
  if (gameState === 'paused')  drawOverlay('PAUSE', 'P POUR REPRENDRE');
  if (gameState === 'dead')    drawOverlay('GAME OVER', 'SCORE: ' + String(score).padStart(6,'0') + '  |  ESPACE = REJOUER');
  if (gameState === 'levelup') drawLevelUp();
}

function loop(ts) {
  var dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt); render();
  requestAnimationFrame(loop);
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
    if (gameState === 'idle' || gameState === 'dead') { initGame(); gameState = 'playing'; }
  }
  if (e.key === 'p' || e.key === 'P') {
    if (gameState === 'playing') gameState = 'paused';
    else if (gameState === 'paused') gameState = 'playing';
  }
});
document.addEventListener('keyup', function(e) { keys[e.key] = false; });

var touchStartX = 0;
canvas.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  if (gameState === 'idle' || gameState === 'dead') { initGame(); gameState = 'playing'; return; }
  keys[' '] = true; setTimeout(function() { keys[' '] = false; }, 120);
}, { passive: true });
canvas.addEventListener('touchmove', function(e) {
  var dx = e.touches[0].clientX - touchStartX;
  touchStartX = e.touches[0].clientX;
  player.x = Math.max(0, Math.min(W-player.w, player.x+dx));
}, { passive: true });

// ─── BOOT ────────────────────────────────────────────────────────────────────
initGame();
gameState = 'idle';
lastTime = performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
